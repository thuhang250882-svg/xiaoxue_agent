rules:
  - id: TERM-001
    category: terminology
    name: 专业术语规范性
    severity: low
    checks:
      - 错别字
      - 不规范简称
      - 口语化表达
      - 名称前后不一致
      - 单位不统一

  - id: TERM-002
    category: terminology
    name: 术语一致性
    severity: medium
    checks:
      - 同一术语全文使用一致
      - 专业术语使用规范写法
      - 避免口语化表达