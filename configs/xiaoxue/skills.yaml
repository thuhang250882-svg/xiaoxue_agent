version: "3.0"
network_policy: office_network_local_only
skills:
  - id: geology_report_review
    agent: report
    runtime_skill: geolog-logging-review
    tool: geology_report_review
    output: geology_report_review_result
  - id: mud_logging_supervision
    agent: report
    runtime_skill: mud-logging-supervision
  - id: office_assistant
    agent: office
    runtime_skill: office-assistant
    tool: office_document
    output: office_document_result
  - id: oilfield_it_project_management
    agent: office
    runtime_skill: oilfield-it-project-management
  - id: tender_management
    agent: tender
    runtime_skill: tender-management
    tool: tender_review
    output: tender_review_result
  - id: contract_management
    agent: contract
    runtime_skill: contract-management
    tool: contract_review
    output: contract_review_result
  - id: knowledge_query
    agent: knowledge
    runtime_skill: geology-knowledge
    tool: knowledge_search
    management_tool: knowledge_manage
    output: knowledge_search_result
  - id: knowledge_management
    agent: knowledge
    runtime_skill: knowledge-management
    tool: knowledge_manage
  - id: document_generation
    agent: document
    runtime_skill: mud-logging-report-generation
    implementation: partial_office_docx
  - id: skill_governance
    agent: knowledge
    runtime_skill: skill-governance

loading:
  mechanism: OpenCode Skill discovery
  runtime_root: .opencode/skills
expected_top_level_skills: 27

policy:
  external_network_skills: disabled_and_removed
  github_skills: disabled_and_removed
  local_scripts: allowed_with_existing_permission_rules
  unit_intranet_materials: allowed_when_user_authorized
