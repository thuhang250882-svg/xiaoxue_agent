version: "2.1"
skills:
  - id: geology_report_review
    agent: report
    runtime_skill: geolog-logging-review
    tool: geology_report_review
    output: geology_report_review_result
  - id: office_assistant
    agent: office
    runtime_skill: office-assistant
    tool: office_document
    output: office_document_result
  - id: tender_review
    agent: tender
    runtime_skill: tender-document-review
    tool: tender_review
    output: tender_review_result
  - id: tender_bid_generation
    agent: tender
    runtime_skill: tender-bid-generation
    output: tender_bid_generation_draft
  - id: contract_review
    agent: contract
    runtime_skill: 审查合同
    tool: contract_review
    output: contract_review_result
  - id: knowledge_query
    agent: knowledge
    runtime_skill: geology-knowledge
    tool: knowledge_search
    management_tool: knowledge_manage
    output: knowledge_search_result
  - id: document_generation
    agent: document
    runtime_skill: mud-logging-report-generation
    implementation: partial_office_docx
loading:
  mechanism: OpenCode Skill discovery
  runtime_root: .opencode/skills

portable_pack:
  source: workbuddy-skills-portable
  imported_skills: 33
  routing: semantic_description_and_xiaoxue_router
  execution_policy: local_scripts_and_external_services_require_user_approval
  agents:
    xiaoxue:
      - darwin-skill
      - fullstack-dev
    report:
      - geolog-logging-review
      - markitdown-skill
      - pdfkit-py
      - tencentcloud-ocr
    tender:
      - tender-management
      - tender-bid-generation
      - markitdown-skill
      - pdfkit-py
      - tencentcloud-ocr
    contract:
      - 起草合同
      - 合同台账提醒
      - 审查合同
      - tencent-esign-contract
      - markitdown-skill
      - pdfkit-py
      - tencentcloud-ocr
    office:
      - autoresearch
      - image-well
      - material-organizer
      - nano-banana-pro
      - openai-whisper-api
      - pptx-generator
      - prompt-engineering-expert
      - tencent-meeting-skill
      - yourself-skill
    knowledge:
      - aihot
      - browser-use
      - darwin-skill
      - deep-research
      - fullstack-dev
      - github
      - github-trending-cn
      - image-well
      - llm-wiki-knowledge
